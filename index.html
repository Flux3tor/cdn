<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxCDN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:#050505;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.grid{
  position:fixed; inset:0;
  background-image:linear-gradient(#111 1px,transparent 1px),
                   linear-gradient(90deg,#111 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(circle at center,black 30%,transparent 90%);
}

.cursor{
  position:fixed;width:600px;height:600px;
  background:radial-gradient(circle,#ffffff18,transparent 60%);
  pointer-events:none;mix-blend-mode:screen;
  transform:translate(-50%,-50%);
}

#overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;opacity:0;pointer-events:none;transition:.25s;
}
#overlay.show{opacity:1}

.card{
  width:520px;padding:55px;border-radius:28px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 120px rgba(0,0,0,.9);
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:fade 1s ease,breathe 6s infinite ease-in-out;
}
@keyframes fade{from{opacity:0;transform:translate(-50%,-60%)}}
@keyframes breathe{
 0%,100%{transform:translate(-50%,-50%) scale(1)}
 50%{transform:translate(-50%,-50%) scale(1.01)}
}

h1{font-size:42px;margin:0}
.sub{opacity:.6;margin:10px 0 30px}

.drop{
  border:2px dashed rgba(255,255,255,.25);
  border-radius:20px;padding:45px;
  background:rgba(255,255,255,.03);
  cursor:pointer;transition:.35s;
}
.drop.drag{background:rgba(255,255,255,.08);border-color:#fff;transform:scale(1.04)}

button{
  margin-top:28px;padding:15px 38px;border-radius:16px;
  border:none;background:linear-gradient(90deg,#fff,#bbb);
  color:#000;font-weight:700;cursor:pointer;
}

.progress{margin-top:24px;height:8px;background:#111;border-radius:20px;overflow:hidden;display:none}
.bar{height:100%;width:0;background:linear-gradient(90deg,#fff,#aaa);}

.linkBox{
  margin-top:22px;padding:18px;border-radius:16px;
  background:linear-gradient(145deg,#0d0d0d,#111);
  box-shadow:inset 0 0 20px #000,0 0 25px #ffffff10;
  display:none;animation:pop .4s ease;
}
@keyframes pop{from{transform:scale(.8);opacity:0}}

.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%);
  background:#111;padding:12px 24px;border-radius:12px;
  opacity:0;transition:.3s;
}

footer{
  position:fixed;bottom:15px;width:100%;
  text-align:center;opacity:.6;font-size:13px;
}
footer a{color:#fff;text-decoration:none}
footer a:hover{text-decoration:underline}

input{display:none}
</style>
</head>

<body>
<div class="grid"></div>
<div class="cursor" id="cursor"></div>
<div id="overlay">Drop file to upload</div>

<div class="card">
  <h1>FluxCDN</h1>
  <div class="sub">Upload • Share • Global CDN</div>

  <div class="drop" id="drop">Drop file or click to browse</div>
  <input type="file" id="file">

  <button onclick="upload()">Upload</button>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="linkBox" id="linkBox">
    <span id="link"></span><br>
    <small onclick="copy()">Click to copy</small>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<footer>
  Built by <a href="https://github.com/Flux3tor" target="_blank">Flux3tor</a> • 
  <a href="https://flux3tor.xyz" target="_blank">flux3tor.xyz</a>
</footer>

<script>
document.addEventListener("mousemove",e=>{
 cursor.style.left=e.clientX+"px";
 cursor.style.top=e.clientY+"px";
});

window.addEventListener("dragenter",()=>overlay.classList.add("show"));
window.addEventListener("dragleave",()=>overlay.classList.remove("show"));
window.addEventListener("drop",()=>overlay.classList.remove("show"));

document.addEventListener("paste",e=>{
 if(e.clipboardData.files.length){
  file=e.clipboardData.files[0];
  drop.innerText=file.name+" (pasted)";
 }
});

let file;
const fileInput = document.getElementById("file");

drop.onclick = () => fileInput.click();

drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag") }
drop.ondragleave = () => drop.classList.remove("drag")
drop.ondrop = e => {
  e.preventDefault();
  drop.classList.remove("drag");
  file = e.dataTransfer.files[0];
  drop.innerText = file.name;
}

fileInput.onchange = e => {
  file = e.target.files[0];
  drop.innerText = file.name;
}

async function upload(){
 if(!file)return;
 const form=new FormData();
 form.append("file",file);
 document.querySelector(".progress").style.display="block";
 const bar=document.getElementById("bar");

 const xhr=new XMLHttpRequest();
 xhr.upload.onprogress=e=>{
   bar.style.width=(e.loaded/e.total*100)+"%";
 };
 xhr.onload=()=>{
   linkBox.style.display="block";
   link.innerText=xhr.responseText;
 };
 xhr.open("POST","/");
 xhr.send(form);
}

function copy(){
 navigator.clipboard.writeText(link.innerText);
 toast.style.opacity=1;
 setTimeout(()=>toast.style.opacity=0,2000);
}
</script>
</body>
</html>
